[project]
name = "moviemind"
version = "0.1.0"
description = "Moviemind using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.203.0,<1.0.0"
]

[project.scripts]
moviemind = "moviemind.main:run"
run_crew = "moviemind.main:run"
train = "moviemind.main:train"
replay = "moviemind.main:replay"
test = "moviemind.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
