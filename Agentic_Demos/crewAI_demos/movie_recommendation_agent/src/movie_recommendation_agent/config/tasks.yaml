recommendation_task:
  description: >
    If the query is about recommending movies (e.g., "movies of action in 2025"),
    return a list of relevant movie titles with their release years.
  expected_output: >
    A bullet list of at least 5 recommended movies with title and release year.
  agent: recommendation_agent

plot_task:
  description: >
    If the query is about a specific movie (e.g., "plot of Titanic"),
    return movie details: title, year, IMDb rating, genre, and plot.
  expected_output: >
    A formatted summary containing title, year, IMDb rating, genre, and plot.
  agent: plot_agent
